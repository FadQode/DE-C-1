[project]
name = "irdi"
version = "0.1.0"
description = "Indonesia Regional Development Intelligence"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.7,<3.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irdi"]